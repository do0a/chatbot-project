<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI에게 질문하기</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f7fb;
            color: #222;
        }

        .chat-container {
            width: 800px;
            max-width: 94%;
            height: 90vh;
            margin: 30px auto;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 상단 */
        .header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 7px 0 0;
            color: #777;
            font-size: 14px;
        }

        /* 채팅 영역 */
        .chat-box {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
        }

        /* 메시지 */
        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* AI 말풍선 */
        .ai .bubble {
            background-color: #f0f2f7;
        }

        /* 사용자 말풍선 */
        .user .bubble {
            background-color: #4f6df5;
            color: white;
        }

        /* 오답 노트 저장 버튼 */
        .save-form {
            margin: -5px 0 20px 0;
        }

        .save-button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;

            background-color: #f1f3f8;
            color: #444;

            cursor: pointer;
            font-size: 14px;
        }

        .save-button:hover {
            background-color: #e2e5ed;
        }

        /* 저장 완료 메시지 */
        .saved-message {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 15px;

            background-color: #eef8ee;
            color: #357a38;

            border-radius: 8px;
            font-size: 14px;
        }

        /* 입력 영역 */
        .input-area {
            padding: 15px;
            border-top: 1px solid #eee;
        }

        /* 과목 선택 */
        .subject-select {
            width: 100%;
            padding: 11px;

            border: 1px solid #ddd;
            border-radius: 10px;

            background-color: white;
            font-size: 14px;

            outline: none;
            margin-bottom: 10px;
        }

        .subject-select:focus {
            border-color: #4f6df5;
        }

        /* 질문 입력 */
        .input-box {
            display: flex;
            gap: 10px;
        }

        .input-box textarea {
            flex: 1;
            height: 50px;
            resize: none;

            border: 1px solid #ddd;
            border-radius: 12px;

            padding: 14px;
            font-size: 15px;
            outline: none;
        }

        .input-box textarea:focus {
            border-color: #4f6df5;
        }

        /* 전송 버튼 */
        .send-button {
            width: 80px;
            border: none;
            border-radius: 12px;

            background-color: #4f6df5;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        .send-button:hover {
            background-color: #3d59d8;
        }

        /* 홈 */
        .bottom {
            text-align: center;
            padding: 10px;
        }

        .bottom a {
            color: #777;
            text-decoration: none;
            font-size: 14px;
        }

        .bottom a:hover {
            color: #4f6df5;
        }

        /* 모바일 */
        @media (max-width: 600px) {

            .chat-container {
                height: 94vh;
                margin: 15px auto;
            }

            .chat-box {
                padding: 15px;
            }

            .bubble {
                max-width: 85%;
            }

            .input-box textarea {
                height: 48px;
            }

            .send-button {
                width: 65px;
            }
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <!-- 상단 -->
        <div class="header">

            <h1>🤖 AI 오답 노트 챗봇</h1>

            <p>
                궁금한 내용을 자유롭게 질문해보세요.
            </p>

        </div>


        <!-- 채팅 내용 -->
        <div class="chat-box">

            <!-- 처음 접속했을 때 -->
            {% if not user_question %}

            <div class="message ai">

                <div class="bubble">
                    안녕하세요! 👋

                    공부하다 궁금한 내용을 질문해주세요.
                </div>

            </div>

            {% endif %}


            <!-- 사용자 질문 -->
            {% if user_question %}

            <div class="message user">

                <div class="bubble">
                    {{ user_question }}
                </div>

            </div>

            {% endif %}


            <!-- AI 답변 -->
            {% if answer %}

            <div class="message ai">

                <div class="bubble">
                    {{ answer }}
                </div>

            </div>


            <!-- 오답 노트 저장 -->
            {% if not saved %}

            <form
                method="POST"
                action="/question"
                class="save-form"
            >

                <input
                    type="hidden"
                    name="question"
                    value="{{ user_question }}"
                >

                <input
                    type="hidden"
                    name="answer"
                    value="{{ answer }}"
                >

                <input
                    type="hidden"
                    name="subject"
                    value="{{ selected_subject }}"
                >

                <input
                    type="hidden"
                    name="save"
                    value="yes"
                >

                <button
                    type="submit"
                    class="save-button"
                >
                    📖 오답 노트에 저장
                </button>

            </form>

            {% endif %}


            <!-- 저장 완료 -->
            {% if saved %}

            <div class="saved-message">
                ✅ 오답 노트에 저장되었습니다!
            </div>

            {% endif %}

            {% endif %}

        </div>


        <!-- 질문 입력 -->
        <div class="input-area">

            <form
                method="POST"
                action="/question"
            >

                <!-- 과목 선택 -->
                <select
                    name="subject"
                    class="subject-select"
                    required
                >

                    <option value="">
                        📚 과목을 선택하세요
                    </option>

                    {% for subject in subjects %}

                    <option
                        value="{{ subject }}"
                        {% if subject == selected_subject %}selected{% endif %}
                    >
                        {{ subject }}
                    </option>

                    {% endfor %}

                </select>


                <!-- 질문 입력 -->
                <div class="input-box">

                    <textarea
                        name="question"
                        placeholder="질문을 입력하세요..."
                        required
                    ></textarea>

                    <button
                        type="submit"
                        class="send-button"
                    >
                        전송
                    </button>

                </div>

            </form>

        </div>


        <!-- 홈으로 -->
        <div class="bottom">

            <a href="/">
                ← 홈으로 돌아가기
            </a>

        </div>

    </div>

</body>
</html>
