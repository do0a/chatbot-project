<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인 | AI 오답 노트</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8fc;font-family:Arial,'Noto Sans KR',sans-serif;color:#1f2937}.card{width:min(420px,92vw);padding:36px;background:white;border:1px solid #e8eaf0;border-radius:18px;box-shadow:0 10px 30px #202f5910}h1{font-size:25px;margin:6px 0 10px}p{color:#818899;font-size:13px;margin-bottom:25px}.brand{color:#4f6df5;font-size:12px;font-weight:700;letter-spacing:1px}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}input{width:100%;padding:13px;border:1px solid #dfe2e9;border-radius:9px;font-size:14px}button{width:100%;margin-top:23px;padding:14px;border:0;border-radius:9px;background:#4f6df5;color:white;font-weight:700;cursor:pointer}a{color:#4f6df5;text-decoration:none}.bottom{text-align:center;margin-top:20px;font-size:13px}.error{padding:12px;background:#fff1f1;color:#b42318;border-radius:8px;font-size:13px;margin:12px 0}
</style></head><body><main class="card"><div class="brand">AI STUDY ASSISTANT</div><h1>로그인</h1><p>나만의 오답 노트로 공부를 이어가세요.</p>{% with msgs = get_flashed_messages() %}{% for msg in msgs %}<div class="error">{{ msg }}</div>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="next" value="{{ next }}"><label for="username">아이디</label><input id="username" name="username" autocomplete="username" required maxlength="30"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">로그인</button></form><div class="bottom">계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></div></main></body></html>
